name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 LTS: node:sqlite available and --experimental-sqlite flag valid
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npx tsc

      # public/bot.js is gitignored: the browser bot is built from src/bot/ so
      # that it and the worker share one copy of the rules. wrangler-action runs
      # its own command rather than the deploy npm script, so the build has to be
      # an explicit step here or the deployed page would 404 on /bot.js.
      - run: npm run build:bot

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
